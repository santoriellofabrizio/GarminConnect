[project]
name = "garmin-mcp"
version = "0.1.0"
description = "MCP server per Garmin Connect (salute, sonno, attività, metriche di allenamento)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.0",
    "garminconnect>=0.3.20",
]

[project.scripts]
garmin-mcp = "garmin_mcp.server:main"
garmin-mcp-auth = "garmin_mcp.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]
